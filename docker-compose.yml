services:

  postgres:
    image: postgres:15-alpine
    container_name: 'postgres_db'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  product_service:
    build: ./services/product_service
    container_name: product_service
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ./services/product_service:/app
    ports:
      - "8001:8001"
      - "5555:5555"  # ZMQ PUB — accessible par les subscribers
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}
      - ZMQ_PUB_PORT=5555
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy

  pricing_service:
    build: ./services/pricing_service
    container_name: pricing_service
    command: uv run python main.py
    volumes:
      - ./services/pricing_service:/app
    ports:
      - "5556:5556"  # ZMQ REP — accessible par le client REQ de la gateway
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}
      - PRODUCT_ZMQ_URL=tcp://product_service:5555
      - PRICING_REP_PORT=5556
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      product_service:
        condition: service_started

  inventory_service:
    build: ./services/inventory_service
    container_name: inventory_service
    command: uv run python main.py
    volumes:
      - ./services/inventory_service:/app
    ports:
      - "5557:5557"  # ZMQ REP — accessible par le client REQ de la gateway
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}
      - PRODUCT_ZMQ_URL=tcp://product_service:5555
      - INVENTORY_REP_PORT=5557
      - ORDERLINE_ZMQ_URL=tcp://order_service:5560
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      product_service:
        condition: service_started

  order_service:
    build: ./services/order_service
    container_name: order_service
    command: uv run python main.py
    volumes:
      - ./services/order_service:/app
    ports:
      - "5558:5558"  # ZMQ REP
      - "5560:5560"  # ZMQ PUB — orderline events
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}
      - ORDER_REP_PORT=5558
      - ORDER_PUB_PORT=5560
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy

  customer_service:
    build: ./services/customer_service
    container_name: customer_service
    command: uv run python main.py
    volumes:
      - ./services/customer_service:/app
    ports:
      - "5559:5559"  # ZMQ REP
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-app_db}
      - CUSTOMER_REP_PORT=5559
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy

  gateway_service:
    build: ./services/gateway_service
    container_name: gateway_service
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/gateway_service:/app
    ports:
      - "8000:8000"
    environment:
      - PRODUCT_SERVICE_URL=http://product_service:8001
      - PRICING_ZMQ_URL=tcp://pricing_service:5556
      - INVENTORY_ZMQ_URL=tcp://inventory_service:5557
      - ORDER_ZMQ_URL=tcp://order_service:5558
      - CUSTOMER_ZMQ_URL=tcp://customer_service:5559
      - PYTHONUNBUFFERED=1
    depends_on:
      product_service:
        condition: service_started
      pricing_service:
        condition: service_started
      inventory_service:
        condition: service_started
      order_service:
        condition: service_started
      customer_service:
        condition: service_started

volumes:
  postgres_data:
